<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <!-- Indigo/Violet Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="6" />
  
  <!-- Subtle Background Grid/Aura -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(99, 102, 241, 0.12)" stroke-width="2" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(139, 92, 246, 0.08)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Main Symbol: Clapperboard & Star Sched (Manager Planner) -->
  <g transform="translate(106, 116)">
    <!-- Clapperboard Base Box -->
    <rect x="20" y="90" width="260" height="190" rx="24" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="6" filter="url(#glow)" />
    
    <!-- Timeline / Schedule Bars Inside Clapperboard -->
    <rect x="50" y="140" width="80" height="12" rx="6" fill="#6366f1" />
    <rect x="140" y="140" width="110" height="12" rx="6" fill="rgba(255,255,255,0.2)" />

    <rect x="50" y="170" width="130" height="12" rx="6" fill="#a855f7" />
    <rect x="190" y="170" width="60" height="12" rx="6" fill="rgba(255,255,255,0.2)" />

    <rect x="50" y="200" width="100" height="12" rx="6" fill="#38bdf8" />
    <rect x="160" y="200" width="90" height="12" rx="6" fill="rgba(255,255,255,0.2)" />

    <rect x="50" y="230" width="140" height="12" rx="6" fill="url(#goldGrad)" />
    <rect x="200" y="230" width="50" height="12" rx="6" fill="rgba(255,255,255,0.2)" />

    <!-- Top Clapper Bar (Angled) -->
    <g transform="rotate(-12 20 85)">
      <rect x="15" y="45" width="270" height="42" rx="10" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="5" />
      <!-- Striped Patterns -->
      <polygon points="45,47 65,47 45,85 25,85" fill="#f8fafc" />
      <polygon points="95,47 115,47 95,85 75,85" fill="#f8fafc" />
      <polygon points="145,47 165,47 145,85 125,85" fill="#f8fafc" />
      <polygon points="195,47 215,47 195,85 175,85" fill="#f8fafc" />
      <polygon points="245,47 265,47 245,85 225,85" fill="#f8fafc" />
    </g>

    <!-- Star Emblem on Front Right (Artist Star) -->
    <g transform="translate(210, 180)">
      <circle cx="35" cy="35" r="38" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />
      <path d="M 35 15 L 41 28 L 55 30 L 45 40 L 47 54 L 35 47 L 23 54 L 25 40 L 15 30 L 29 28 Z" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
