<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 결과 | 로드플래너</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: #F6F7F9; min-height: 100vh; color: #111827;
      display: flex; flex-direction: column; align-items: center;
    }
    .wrap { width: 100%; max-width: 440px; padding: 32px 16px 40px; }
    .hero { text-align: center; margin-bottom: 20px; }
    .icon {
      width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 900; background: #e5e7eb; color: #6b7280;
    }
    .icon.ok { background: #dcfce7; color: #15803d; }
    .icon.fail { background: #fee2e2; color: #b91c1c; }
    .icon.va { background: #E3E6FA; color: #2B338F; }
    .result-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
    .result-sub { font-size: 14px; color: #6b7280; line-height: 1.6; }
    .big-amount { font-size: 30px; font-weight: 900; color: #3B45C4; margin-top: 10px; }
    .card { background: #fff; border-radius: 16px; padding: 6px 18px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 14px; border-bottom: 1px solid #f0f0f3; }
    .info-row:last-child { border-bottom: none; }
    .info-row span:first-child { color: #6b7280; flex-shrink: 0; }
    .info-row span:last-child { color: #111827; font-weight: 700; text-align: right; word-break: break-all; }
    .note { background: #f5f7ff; border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #374151; line-height: 1.55; margin-bottom: 12px; }
    .note.warn { background: #fff7ed; color: #9a3412; }
    .copy-btn { margin-left: 6px; padding: 3px 9px; border-radius: 8px; border: 1px solid #D5D9F7; background: #EEF0FD; color: #2B338F; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-primary {
      display: block; width: 100%; padding: 16px; border-radius: 14px; border: none; background: #3B45C4; color: #fff;
      font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; margin-bottom: 10px;
    }
    .btn-secondary {
      display: block; width: 100%; padding: 15px; border-radius: 14px; border: 1px solid #e5e7eb; background: #fff; color: #374151;
      font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; margin-bottom: 10px;
    }
  </style>
<script src="js/icons.js?v=336"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js?v=336"></script>
</head>
<body>
<div id="test-banner" style="position:sticky;top:0;z-index:9999;width:100%;background:#f59e0b;color:#1f1300;text-align:center;font:700 13px/1.4 Pretendard,sans-serif;padding:8px 12px;">🧪 테스트 결제 — 실제 결제되지 않습니다 (카드가 청구되지 않아요)</div>
<div class="wrap" id="result-wrap">
  <div class="hero">
    <div class="icon" id="result-icon">…</div>
    <div class="result-title" id="result-title">확인하고 있어요</div>
    <div class="result-sub" id="result-sub">결제 결과를 확인하고 있어요. 잠시만 기다려 주세요.</div>
    <div class="big-amount" id="big-amount" style="display:none;"></div>
  </div>
  <div class="card" id="info-box" style="display:none;">
    <div class="info-row" id="r-va-due-row" style="display:none;"><span>입금 기한</span><span id="r-va-due">—</span></div>
    <div class="info-row" id="r-va-bank-row" style="display:none;"><span>은행</span><span id="r-va-bank">—</span></div>
    <div class="info-row" id="r-va-acc-row" style="display:none;"><span>계좌번호</span><span id="r-va-acc">—</span></div>
    <div class="info-row" id="r-va-holder-row" style="display:none;"><span>입금자명</span><span id="r-va-holder">—</span></div>
    <div class="info-row"><span>주문번호</span><span id="r-order-id">—</span></div>
    <div class="info-row" id="r-amount-row"><span>결제 금액</span><span id="r-amount">—</span></div>
    <div class="info-row" id="r-method-row" style="display:none;"><span>결제 수단</span><span id="r-method">—</span></div>
    <div class="info-row" id="r-slots-row"><span>요금제</span><span id="r-slots">—</span></div>
    <div class="info-row" id="r-next-row" style="display:none;"><span>다음 결제일</span><span id="r-next">—</span></div>
    <div class="info-row" id="r-date-row"><span>결제 일시</span><span id="r-date">—</span></div>
    <div class="info-row" id="r-receipt-row" style="display:none;"><span>매출전표</span><span id="r-receipt">—</span></div>
  </div>
  <div class="note" id="r-note" style="display:none;"></div>
  <button class="btn-primary" id="btn-va-confirm" style="display:none; background:#059669;" onclick="simulateVirtualDepositDone()">⚡ 입금 확인 시뮬레이션 (즉시 승인)</button>
  <button class="btn-primary" id="btn-retry" onclick="goToPayment()" style="display:none;">다른 카드로 결제하기</button>
  <button class="btn-primary" id="btn-main" onclick="goToAdmin()">관제 포털로 이동</button>
</div>

<script>
  const IS_DEV_HOST = ['localhost','127.0.0.1',''].includes(location.hostname) || location.protocol === 'file:';
  const params       = new URLSearchParams(location.search);
  const status       = params.get('status');
  const plan         = params.get('plan') || 'standard';
  const isProPlan    = (plan === 'pro');
  const returnTarget = params.get('return') || (isProPlan ? 'mobile' : 'admin');
  const paymentKey   = params.get('paymentKey') || '';
  const orderId      = params.get('orderId') || '';
  const addSlots     = parseInt(params.get('addSlots') || '0');
  const totalSlots   = parseInt(params.get('totalSlots') || (isProPlan ? '1' : '2'));
  const totalFee     = parseInt(params.get('amount') || params.get('totalFee') || (isProPlan ? '20000' : '110000'));
  const won = (n) => Number(n).toLocaleString() + '원';
  const md = (d) => { const x = new Date(d); return `${x.getMonth() + 1}월 ${x.getDate()}일`; };
  const WD = ['일', '월', '화', '수', '목', '금', '토'];

  const iconEl    = document.getElementById('result-icon');
  const titleEl   = document.getElementById('result-title');
  const subEl     = document.getElementById('result-sub');
  const infoBox   = document.getElementById('info-box');
  const noteEl    = document.getElementById('r-note');
  const btnRetry  = document.getElementById('btn-retry');
  const btnMain   = document.getElementById('btn-main');
  const btnVaConfirm = document.getElementById('btn-va-confirm');
  const backLabel = (isProPlan || returnTarget === 'mobile') ? '플래너 앱으로 돌아가기' : '관제 포털로 돌아가기';
  const planText  = isProPlan ? '개인 매니저 유료 (월 정기)' : `회사 요금제 · 매니저 ${totalSlots}자리`;
  const nextAmt   = parseInt(params.get('nextAmt') || '0') || 0;   // 다음 자동결제 금액 (자리 추가 후)

  let currentPayData = null;

  async function processPaymentResult() {
    if (status === 'fail' || (!paymentKey && status !== 'success')) {
      showFail(params.get('message') || '결제가 취소됐거나 올바르지 않은 요청이에요.', params.get('code'));
      return;
    }

    if (paymentKey) {
      try {
        // 서버가 토스에 승인 요청 → 금액·주문자 확인 → 승인되면 요금제/인원 반영
        if (!SupabaseClient.isConfigured) SupabaseClient.init();
        const data = await SupabaseClient.invokePayments({ action: 'confirm', paymentKey, orderId, amount: parseInt(params.get('amount') || '0') });
        currentPayData = data;
        if (data.status === 'DONE') showSuccess(data);
        else if (data.status === 'WAITING_FOR_DEPOSIT') showVirtualAccount(data);
        else showFail('결제 승인 처리에 실패했어요.');
      } catch (err) {
        console.warn('결제 승인 오류:', err);
        showFail((err && err.message) || '결제 승인에 실패했어요. 돈은 빠져나가지 않았어요.', err && err.code);
      }
    } else if (status === 'success') {
      if (!IS_DEV_HOST) {
        showFail('결제 승인 정보가 없어 완료 처리할 수 없어요. 돈은 빠져나가지 않았어요.');
        return;
      }
      const vaAcc = params.get('vaAcc');
      if (params.get('method') === 'VIRTUAL_ACCOUNT' || vaAcc) {
        showVirtualAccount({
          virtualAccount: {
            bank: params.get('vaBank') || 'KB국민은행',
            accountNumber: vaAcc || '004-819230-02-123',
            customerName: params.get('vaHolder') || '',
            dueDate: params.get('vaDue') || new Date(Date.now() + 3 * 86400000).toISOString()
          }
        });
      } else {
        const next = new Date(); next.setMonth(next.getMonth() + 1);
        showSuccess({ method: '테스트 승인', status: 'DONE', periodEnd: params.get('nextAt') || next.toISOString() });
      }
    }
  }

  const esc = (v) => String(v ?? '').replace(/[&<>"'`]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;' }[c]));
  const show = (id) => { document.getElementById(id).style.display = 'flex'; };

  function showVirtualAccount(payData) {
    iconEl.className = 'icon va'; iconEl.textContent = '₩';
    titleEl.textContent = '입금 계좌가 만들어졌어요';
    subEl.textContent = '아래 계좌로 기한 안에 입금하면 바로 적용돼요.';
    const big = document.getElementById('big-amount'); big.textContent = won(totalFee); big.style.display = 'block';
    infoBox.style.display = 'block';

    const va = payData.virtualAccount || {};
    document.getElementById('r-order-id').textContent = payData.orderId || orderId || '—';
    document.getElementById('r-amount-row').style.display = 'none';
    document.getElementById('r-date-row').style.display = 'none';
    document.getElementById('r-slots').textContent = planText;

    if (va.dueDate) {
      const d = new Date(va.dueDate);
      const hm = d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
      document.getElementById('r-va-due').textContent = `${md(d)} (${WD[d.getDay()]}) ${hm}까지`;
      show('r-va-due-row');
    }
    if (va.bank || va.bankCode) { document.getElementById('r-va-bank').textContent = va.bank || va.bankCode; show('r-va-bank-row'); }
    if (va.accountNumber) {
      const acc = String(va.accountNumber);
      const box = document.getElementById('r-va-acc');
      box.innerHTML = `${esc(acc)}<button type="button" class="copy-btn" id="btn-copy-acc">복사</button>`;
      document.getElementById('btn-copy-acc').onclick = async () => {
        try { await navigator.clipboard.writeText(acc); } catch (e) { }
        document.getElementById('btn-copy-acc').textContent = '복사됨';
      };
      show('r-va-acc-row');
    }
    if (va.customerName) { document.getElementById('r-va-holder').textContent = va.customerName; show('r-va-holder-row'); }

    let note = '가상계좌는 자동결제가 안 돼요. 매달 결제일 전에 새 입금 계좌를 보내드려요.';
    if (params.get('taxNum')) note += '<br>입금이 확인되면 세금계산서를 적어 주신 이메일로 보내드려요.';
    noteEl.innerHTML = note; noteEl.style.display = 'block';

    btnVaConfirm.style.display = IS_DEV_HOST ? 'block' : 'none';
    btnMain.className = 'btn-secondary';
    btnMain.textContent = backLabel;
    saveSubscriptionRecord(payData, 'waiting_deposit');
  }

  function simulateVirtualDepositDone() {
    if (!IS_DEV_HOST) return;
    btnVaConfirm.style.display = 'none';
    const next = new Date(); next.setMonth(next.getMonth() + 1);
    showSuccess({
      ...currentPayData, status: 'DONE', periodEnd: next.toISOString(),
      method: (currentPayData && currentPayData.virtualAccount ? (currentPayData.virtualAccount.bank + ' 가상계좌 (입금 완료)') : '가상계좌 (입금 완료)')
    });
  }

  function showSuccess(payData) {
    iconEl.className = 'icon ok'; iconEl.textContent = '✓';
    titleEl.textContent = '결제가 완료됐어요';
    document.getElementById('big-amount').style.display = 'none';
    ['r-va-due-row', 'r-va-bank-row', 'r-va-acc-row', 'r-va-holder-row'].forEach(id => { document.getElementById(id).style.display = 'none'; });
    document.getElementById('r-amount-row').style.display = 'flex';
    document.getElementById('r-date-row').style.display = 'flex';

    const isProrate = (payData && payData.kind === 'prorate') || params.get('kind') === 'prorate';
    if (isProrate) {
      subEl.textContent = '자리가 늘었어요. 이제 매니저를 추가할 수 있어요.';
    } else if (isProPlan) {
      subEl.textContent = '개인 매니저 유료가 시작됐어요. 앱으로 돌아가면 바로 적용돼요.';
      localStorage.setItem('bp_pro', 'true');
    } else {
      subEl.textContent = '요금제가 적용됐어요. 이제 매니저를 추가할 수 있어요.';
    }
    infoBox.style.display = 'block';

    const amount = (payData && payData.amount) || totalFee;
    document.getElementById('r-order-id').textContent = (payData && payData.orderId) || orderId || '—';
    document.getElementById('r-amount').textContent   = won(amount) + ' (부가세 포함)';
    document.getElementById('r-slots').textContent    = planText;
    document.getElementById('r-date').textContent     = new Date((payData && payData.approvedAt) || Date.now()).toLocaleString('ko-KR');

    const nextAt = (payData && payData.periodEnd) || params.get('nextAt');
    if (nextAt) {
      document.getElementById('r-next').textContent = isProrate && nextAmt
        ? `${md(nextAt)}부터 매달 ${won(nextAmt)}`
        : `${md(nextAt)} (매달 자동결제)`;
      show('r-next-row');
    }
    if (isProrate) document.getElementById('r-amount').textContent = won(amount) + ' (일할 · 부가세 포함)';
    if (payData) {
      let methodText = payData.method || '카드';
      if (payData.card && payData.card.approveNo) methodText += ` · 승인번호 ${payData.card.approveNo}`;
      document.getElementById('r-method').textContent = methodText;
      show('r-method-row');
      if (payData.receipt && payData.receipt.url) {
        document.getElementById('r-receipt').innerHTML = `<a href="${esc(payData.receipt.url)}" target="_blank" rel="noopener" style="color:#3B45C4;">영수증 보기</a>`;
        show('r-receipt-row');
      }
    }
    noteEl.className = 'note';
    noteEl.textContent = isProPlan
      ? '해지는 앱의 내 정보 → 요금제에서 언제든 할 수 있어요. 해지해도 결제한 기간까지는 계속 쓸 수 있어요.'
      : '카드 매출전표가 세금 증빙이 돼요. 결제 내역은 구독 관리에서 다시 볼 수 있어요.';
    noteEl.style.display = 'block';

    saveSubscriptionRecord(payData, 'active');
    // 자동으로 다른 화면으로 넘어가지 않음 (주문번호를 확인할 시간을 줌)
    btnMain.className = 'btn-primary';
    btnMain.textContent = backLabel;
  }

  function saveSubscriptionRecord(payData, subStatus = 'active') {
    const baseSubKey = 'HQ_SUBSCRIPTION_V6';
    const rawEmail = (localStorage.getItem('admin_bp_user_email') || localStorage.getItem('bp_user_email') || '').trim().toLowerCase();
    const safeKey = rawEmail ? rawEmail.replace(/[^a-z0-9_]/g, '_') : 'ceo_kjm_ent_com';
    const accountSubKey = `${baseSubKey}_${safeKey}`;
    const now = new Date();

    try {
      const existing = JSON.parse(localStorage.getItem(accountSubKey) || localStorage.getItem(baseSubKey) || '{}');
      const updatedSub = {
        ...existing,
        plan: plan,
        baseSlots: isProPlan ? 1 : (existing.baseSlots || 2),
        additionalSlots: isProPlan ? 0 : addSlots,
        totalSlots: isProPlan ? 1 : ((existing.baseSlots || 2) + addSlots),
        monthlyFee: totalFee,
        status: subStatus,
        lastPaidAt: now.toISOString(),
        lastOrderId: (payData && payData.orderId) || orderId,
        paymentKey: paymentKey || (payData && payData.paymentKey) || '',
        receiptUrl: payData && payData.receipt ? payData.receipt.url : '',
        virtualAccount: payData && payData.virtualAccount ? payData.virtualAccount : (existing.virtualAccount || null)
      };
      localStorage.setItem(baseSubKey, JSON.stringify(updatedSub));
      localStorage.setItem(accountSubKey, JSON.stringify(updatedSub));
      if (accountSubKey !== `${baseSubKey}_ceo_kjm_ent_com`) {
        localStorage.setItem(`${baseSubKey}_ceo_kjm_ent_com`, JSON.stringify(updatedSub));
      }
      const logsKey = 'HQ_PAYMENT_LOGS';
      const logs = JSON.parse(localStorage.getItem(logsKey) || '[]');
      logs.unshift({
        orderId: (payData && payData.orderId) || orderId,
        plan: isProPlan ? 'PRO' : 'ENTERPRISE',
        amount: totalFee,
        status: subStatus,
        paidAt: now.toISOString(),
        paymentKey: paymentKey || '',
        receiptUrl: payData && payData.receipt ? payData.receipt.url : '',
        method: payData ? (payData.method || (subStatus === 'waiting_deposit' ? '가상계좌' : 'CARD')) : 'CARD'
      });
      localStorage.setItem(logsKey, JSON.stringify(logs.slice(0, 30)));
    } catch(e) {
      console.warn('구독 정보 저장 중 오류:', e);
    }
  }

  function showFail(errorMsg, code) {
    iconEl.className = 'icon fail'; iconEl.textContent = '!';
    titleEl.textContent = '결제가 안 됐어요';
    subEl.textContent = '돈은 빠져나가지 않았어요.';
    infoBox.style.display = 'none';
    noteEl.className = 'note warn';
    noteEl.innerHTML = `<b>이유</b><br>${esc(errorMsg)}${code ? ` <span style="color:#9ca3af;">(${esc(code)})</span>` : ''}`;
    noteEl.style.display = 'block';
    btnRetry.style.display = 'block';
    btnMain.className = 'btn-secondary';
    btnMain.textContent = backLabel;
  }

  processPaymentResult();

  function goToAdmin() {
    if (isProPlan || returnTarget === 'mobile') {
      window.location.href = 'index.html#profile';
    } else {
      window.location.href = 'admin.html';
    }
  }

  // 결제 페이지를 처음부터 다시 엶 (토스 결제창으로 되돌아가지 않도록 뒤로가기 대신 주소로 이동)
  function goToPayment() {
    const u = new URL('payment.html', location.href);
    u.searchParams.set('plan', plan);
    if (!isProPlan) u.searchParams.set('addSlots', String(addSlots));
    u.searchParams.set('return', returnTarget);
    location.href = u.toString();
  }
</script>
</body>
</html>
