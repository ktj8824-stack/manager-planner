<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HQ 엔터프라이즈 최초 가입 | 마스터 스케줄러</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css?v=21">
  <link rel="stylesheet" href="css/base.css?v=21">
  
  <style>
    body {
      background: var(--bg-app);
      color: var(--text-200);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Pretendard', sans-serif;
    }
    
    .admin-login-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-xl);
    }

    .admin-login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .admin-login-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-100);
      margin: 16px 0 8px 0;
      letter-spacing: -0.5px;
    }

    .admin-login-subtitle {
      font-size: 14px;
      color: var(--text-400);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-300);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid transparent;
      color: var(--text-100);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      background: var(--bg-input-focus);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      padding: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }

    .btn-submit:hover {
      background: #005bb5;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 16px;
      display: none;
    }

    .success-msg {
      color: #10b981;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 16px;
      display: none;
    }

    .info-footer {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-500);
    }
  </style>
</head>
<body>

  <div class="admin-login-wrapper">
    <div class="admin-login-logo">
      <h1 class="admin-login-title">🏢 회사(엔터테인먼트) 가입</h1>
      <p class="admin-login-subtitle">HQ ENTERPRISE SCHEDULER</p>
    </div>

    <form id="admin-register-form">
      <div class="form-group">
        <label class="form-label" for="reg-company">엔터테인먼트 회사명</label>
        <input type="text" id="reg-company" class="form-input" placeholder="예: 스타 엔터테인먼트" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-name">대표(CEO) 성함</label>
        <input type="text" id="reg-name" class="form-input" placeholder="예: 홍길동" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-email">CEO 이메일 (로그인 ID)</label>
        <input type="email" id="reg-email" class="form-input" placeholder="예: ceo@star-ent.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-pw">보안 비밀번호</label>
        <input type="password" id="reg-pw" class="form-input" placeholder="••••••••" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-submit">회사 계정 생성하기</button>
      <div id="reg-error" class="error-msg">가입 중 오류가 발생했습니다.</div>
      <div id="reg-success" class="success-msg">가입이 완료되었습니다! 로그인 페이지로 이동합니다...</div>
    </form>

    <div class="info-footer">
      이미 계정이 있으신가요? <br>
      <a href="admin-login.html" style="color:var(--text-400); text-decoration:underline; margin-top:4px; display:inline-block;">마스터 포털 로그인으로 돌아가기</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/api.js?v=155"></script>
  <script>
    document.getElementById('admin-register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const company = document.getElementById('reg-company').value.trim();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pw = document.getElementById('reg-pw').value.trim();
      const errEl = document.getElementById('reg-error');
      const succEl = document.getElementById('reg-success');
      
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      try {
        if (window.SupabaseClient && window.SupabaseClient.isConfigured) {
          // 1. 회원가입 요청 (meta_data에 role, name 전달)
          const { data, error } = await window.SupabaseClient.client.auth.signUp({
            email: email,
            password: pw,
            options: {
              data: {
                name: name,
                role: 'ceo', // 최초 가입자는 CEO
                auth_provider: 'email',
                company_name: company // 회사명 임시 저장
              }
            }
          });
          if (error) throw error;
        } else {
          // 로컬 환경(Supabase 미연결) 시 임시로 로컬스토리지에 가입정보 저장 (테스트용)
          let users = [];
          try {
            users = JSON.parse(localStorage.getItem('mock_registered_users') || '[]');
          } catch(e) {}
          
          if (users.find(u => u.email === email)) {
            throw new Error("이미 가입된 이메일입니다.");
          }
          
          users.push({
            id: 'mgr_local_' + Date.now(),
            email: email,
            password: pw,
            name: name,
            role: 'ceo',
            company_name: company,
            badge: '👑 대표 (CEO)',
            shortBadge: '👑 CEO',
            color: '#f59e0b',
            assignedArtists: []
          });
          localStorage.setItem('mock_registered_users', JSON.stringify(users));
          
          // 콘솔에 디버깅용으로 남김
          console.warn("로컬 환경 모드: 계정이 브라우저에 임시 저장되었습니다.");
        }

        // 회원가입 성공 시 이전 데이터 초기화 (완전 새로운 화면)
        const keysToClear = [
          'HQ_ARTISTS_V5', 'HQ_MANAGERS_V5', 'HQ_VEHICLES_V5', 
          'HQ_SCHEDULES_V5', 'HQ_NOTIFICATIONS_V2', 'HQ_SUBSCRIPTION_V5',
          'bp_schedules_v2', 'bp_custom_schedules_v2', 'bp_event_overrides', 'bp_hidden_events',
          'bp_assigned_artists', 'bp_manager_id', 'bp_user_name', 'bp_user_email'
        ];
        keysToClear.forEach(k => localStorage.removeItem(k));
        
        succEl.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'admin-login.html';
        }, 1500);

      } catch (err) {
        console.error(err);
        errEl.textContent = err.message || '가입 중 오류가 발생했습니다.';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
