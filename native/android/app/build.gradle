plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.roadplanner.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.roadplanner.manager"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        // 앱이 여는 주소 — 도메인을 바꾸면 여기 한 줄만 수정
        buildConfigField "String", "APP_URL", '"https://ktj8824-stack.github.io/manager-planner-app/"'
    }

    signingConfigs {
        // 테스트 설치용 고정 서명 (업데이트 때 지우지 않고 덮어 설치되도록). 플레이스토어 출시 때는 별도 키로 교체
        test {
            storeFile file('test-signing.keystore')
            storePassword 'roadplanner-test'
            keyAlias 'roadplanner-test'
            keyPassword 'roadplanner-test'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.test }
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
