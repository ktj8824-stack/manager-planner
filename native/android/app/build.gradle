plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.roadplanner.manager'
    // 구글 플레이: 2026-08-31부터 새 앱은 안드로이드 16(API 36) 기준이어야 함
    compileSdk 36

    defaultConfig {
        applicationId "com.roadplanner.manager"
        minSdk 26
        targetSdk 36
        // 스토어용(AAB)은 자동 빌드가 번호를 넘겨줌 (플레이는 같은 번호를 두 번 받지 않음)
        versionCode((project.findProperty('rpVersionCode') ?: '3') as Integer)
        versionName((project.findProperty('rpVersionName') ?: '1.2.0') as String)
        // 앱이 여는 주소 — 도메인을 바꾸면 여기 한 줄만 수정
        buildConfigField "String", "APP_URL", '"https://app.roadplanner.kr/"'
    }

    signingConfigs {
        // 테스트 설치용 고정 서명 (업데이트 때 지우지 않고 덮어 설치되도록). 플레이스토어에는 쓰지 않음
        test {
            storeFile file('test-signing.keystore')
            storePassword 'roadplanner-test'
            keyAlias 'roadplanner-test'
            keyPassword 'roadplanner-test'
        }
        // 플레이스토어 업로드 키: 자동 빌드(android-release.yml)가 비밀값에서 꺼내 환경 변수로 넘겨줌
        if (System.getenv('UPLOAD_KS')) {
            upload {
                storeFile file(System.getenv('UPLOAD_KS'))
                storePassword System.getenv('UPLOAD_PW')
                keyAlias System.getenv('UPLOAD_ALIAS') ?: 'upload'
                keyPassword System.getenv('UPLOAD_PW')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.test }
        release {
            minifyEnabled false
            signingConfig System.getenv('UPLOAD_KS') ? signingConfigs.upload : signingConfigs.test
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
